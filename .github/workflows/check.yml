name: 前端與排程檢查

# 只在外殼檔與腳本改動時跑。docs/data/ 底下每天都有新檔，那些不該觸發這個流程。
on:
  push:
    paths:
      - "docs/*.html"
      - "docs/*.js"
      - "docs/*.css"
      - "scripts/**.py"
      - "requirements.txt"
      - ".github/workflows/daily.yml"
      - ".github/workflows/check.yml"
  pull_request:
    paths:
      - "docs/*.html"
      - "docs/*.js"
      - "docs/*.css"
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 版號一錯開，使用者就會拿到「新資料配舊前端」，而且畫面看起來一切正常。
      # 這種漏掉的成本很高、檢查的成本是一秒鐘。
      - name: 前端版號各頁一致
        run: python scripts/check_frontend_version.py

      # 桌面斷點寫在兩個地方：style.css 的版面，與 app.js 的 WIDE_MQ（清單欄位要用
      # JS 決定，CSS 切不動）。錯開的話就是「版面換了、內容還是手機版」，畫面看起來
      # 也不會壞掉，所以沒人會發現。
      - name: 桌面斷點兩邊一致
        run: |
          grep -q "min-width: 1024px" docs/style.css || { echo "style.css 找不到 1024px 斷點"; exit 1; }
          grep -q "WIDE_MQ = '(min-width: 1024px)'" docs/app.js || { echo "app.js 的 WIDE_MQ 與 style.css 對不上"; exit 1; }
          echo "斷點一致：1024px"

      # 並排表的版面規則有三份選擇器（基準／≤767px／≥1024px），各帶一份頁面清單。
      # 只改其中一份不會有任何東西壞掉 —— 至少在你看的那個寬度不會：漏掉 ≥1024px
      # 那一份的症狀是桌面窗格只剩 1060px、捲軸停在半路，而手機完全正常。
      # 這一行已經漏過三次（日股頁、美股的並排軸、韓股頁），三次都是開了桌面才發現。
      - name: 並排頁的版面選擇器沒漏
        run: python scripts/check_pair_pages.py

      # 前端沒有打包步驟，語法錯誤會直接是線上整頁空白。node --check 不需要任何相依套件。
      - name: JS 語法
        run: |
          for f in docs/*.js; do
            node --check "$f" || exit 1
          done
          echo "docs/*.js 全部通過"

  # 排程的步驟大多設了 continue-on-error（一個來源掛掉不該拖垮整天的更新），代價是缺套件也是綠燈。
  # 2026-10 營收、處置、期貨、策略四頁就這樣停了好幾天：四支都 import numpy，requirements.txt 只有 requests。
  # 這裡只裝 requirements.txt，然後確認排程會跑的每一支腳本 import 得到它要的東西（不執行腳本）。
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 只裝 requirements.txt
        run: pip install -r requirements.txt

      - name: 排程腳本的套件齊全
        run: python scripts/check_imports.py
