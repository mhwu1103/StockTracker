name: 抓 Serenity 的貼文

# **排程已關閉，只留手動觸發。** 2026-09-30 起 x.com 對 GitHub runner 一律回 403
# （runner 走 Azure 的 IP 段），而同一支 fetch_x.py 在台灣的家用網路抓得到。
# 排程上線以來 9 輪沒有一輪抓到東西，所以改成在本機抓：
#
#     python scripts/fetch_x.py && python scripts/build_x.py   # 然後 commit、push
#
# 推上去之後網站要等下一次部署才看得到 —— 平日的 daily.yml 會連 docs/ 一起發佈，
# 急的話手動跑這一支（它的抓取那一步照樣會 403 變紅，但重建與發佈會完成）。
# 想知道 X 是不是解封了，也是手動跑一次這支看抓取那一步。
#
# 原本是每 3 小時一次，那個頻率是資料完整性本身：公開 profile 一次只吐首屏 5 則，
# 而他日均約 15 則，**漏掉就沒了**（單篇貼文頁未登入只回 51 字摘要，補不回來）。
# 本機手動抓的間隔拉長多少，就會漏掉多少。
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# 與每日更新分開一個群組：那支要跑將近一小時，兩邊互相取消的話
# 不是掉一天的行情就是掉三小時的貼文。推不上去的情況由下面的 rebase 處理。
concurrency:
  group: x-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 與 daily.yml 同樣的理由抓完整歷史：下面推不上去時要 rebase 到遠端的新 commit。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # fetch_x.py 本身只用標準函式庫與 curl，但它和 build_x.py 都經由 serenity.py
      # 匯入 twse.py（路徑、寫檔、時區都在那裡），而 twse.py 一開頭就 import requests。
      # 不裝的話兩支都會在 import 那一行就死掉 —— fetch 那一步是 continue-on-error，
      # 錯誤會被吞掉，看起來像是「X 沒抓到東西」。
      - name: 安裝相依套件
        run: pip install -r requirements.txt

      # 抓不到不該擋住後面的重建與發佈，所以 continue-on-error；失敗的痕跡由最後
      # 那一步留下。目前這一步在 runner 上一定是 403（見檔頭），留著它是為了
      # 手動跑一次就知道 X 解封了沒有。
      - name: 抓新貼文
        id: fetch
        continue-on-error: true
        timeout-minutes: 5
        env:
          X_DUMP: ${{ runner.temp }}/x_profile.html
        run: python scripts/fetch_x.py

      # 解析不出貼文時 fetch_x.py 會把 X 回的原始頁面寫到 X_DUMP。runner 拿到的
      # 頁面本機重現不了（IP 不同），所以把它留下來下載看 —— log 裡那幾行特徵
      # 分不出原因時，就打開這一份。curl 本身失敗時沒有頁面，這一步會找不到檔而略過。
      - name: 留下 X 回的原始頁面
        if: steps.fetch.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: x-profile-${{ github.run_id }}
          path: ${{ runner.temp }}/x_profile.html
          if-no-files-found: ignore
          retention-days: 7

      # 就算這次沒抓到新的也要重建：互動數會變，而「最近 30 天熱度」是滑動窗，
      # 不重算的話它會停在上一次真的抓到東西的那一天。
      - name: 重建索引
        run: python scripts/build_x.py

      # 只有「真的有貼文內容變動」才提交。
      #
      # index.json 與 state.json 帶著抓取時間，每一輪都會變 —— 照那個判斷的話
      # 一天會生出 8 個內容只有時間戳的 commit。而**不提交不影響網站**：
      # 下面的 upload-pages-artifact 打包的是 runner 上的 docs/ 目錄，不是
      # commit 的內容，所以頁面上的「抓取於」照樣是最新的。
      - name: 提交資料變更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/x
          substantive=$(git diff --staged --name-only -- docs/data/x/tweets docs/data/x/ticker)
          if [ -z "$substantive" ]; then
            echo "只有時間戳變動，不提交（網站仍會用這一份發佈）。"
            git restore --staged docs/data/x
          else
            echo "有變動的貼文檔："
            echo "$substantive" | head -20
            git commit -m "Serenity 貼文更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"

            # 一天跑 8 次，撞上每日更新那一小時的機會不低。同 daily.yml 的理由
            # 不能用 --force：這次的工作樹可能是幾分鐘前的，強推會把期間的改動
            # 整批回退。-X theirs 在 rebase 裡指「正在被套用的那一邊」，也就是
            # bot 自己 —— 這個 commit 只碰 docs/data/x，不會蓋到別人的東西。
            for i in 1 2 3; do
              if git push origin HEAD:main; then
                pushed=1
                break
              fi
              echo "推不上去（第 $i 次）：遠端前進了，拉回來 rebase 再試。"
              git pull --rebase -X theirs origin main
            done
            if [ -z "$pushed" ]; then
              echo "連續三次都推不上去，放棄。"
              exit 1
            fi
          fi

      # 與 daily.yml 同樣由流程直接發佈，不倚賴 push 觸發 —— bot 的 push
      # 不會觸發後續事件，那條路會讓網站停在舊資料。
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4

      # 抓取那一步是 continue-on-error，失敗時整個流程仍然是綠的。
      # 連續失敗會讓資料悄悄停住，所以這裡明確地讓它紅一次。
      - name: 抓取失敗就讓流程紅
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "fetch_x.py 這一輪沒抓到東西。偶爾一次是正常的（X 限流、暫時性錯誤），"
          echo "連續幾輪都這樣就要去看 scripts/serenity.py 的 parse_profile 還對不對。"
          exit 1
