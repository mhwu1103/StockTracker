name: 每日更新成交值排行

on:
  schedule:
    # UTC 08:30 = 台灣 16:30，收盤資料此時已更新完成
    - cron: "30 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write   # 把資料 commit 回倉庫
  pages: write      # 發佈網站
  id-token: write   # 部署到 Pages 時的身分驗證

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 抓完整歷史：下面的「提交資料變更」在推不上去時要 rebase 到遠端的新 commit，
      # 淺 clone 做這件事不保險。這個倉庫只有百來個 commit，抓全份的成本是幾秒鐘。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝相依套件
        run: pip install -r requirements.txt

      - name: 抓取當日收盤行情
        run: python scripts/fetch_daily.py

      # GitHub 的排程可能被延遲甚至整次跳過，當日 API 又只提供最新一個交易日。
      # 這一步用歷史 API 補上最近兩週內任何缺漏的交易日（上市與上櫃都補），
      # 已存在的日期不會發出請求。
      - name: 補抓遺漏的交易日
        run: python scripts/backfill.py --days 14 --sleep 4

      # 紀律頁的大盤溫控。每次重抓這個月與上個月再與舊檔合併，排程漏跑幾天也補得回來。
      # 掛掉只影響紀律頁那一張卡，不該連帶讓當日行情更新失敗。
      - name: 抓加權指數
        continue-on-error: true
        run: python scripts/fetch_taiex.py

      # 價值頁的本益比／殖利率／股淨比（當月那一檔每天覆寫）與最近兩個月的月營收。
      # 只影響價值頁，掛掉不該連帶讓當日行情更新失敗。
      - name: 抓本益比與月營收
        continue-on-error: true
        run: python scripts/fetch_value.py

      # 產業別幾乎不會變，但它只是輔助資訊：證交所這支 API 掛掉時
      # 不該連帶讓當日行情更新失敗，所以允許這一步出錯。
      - name: 更新產業別對照
        continue-on-error: true
        run: python scripts/fetch_industry.py

      # 三大法人買賣超。個股的金額是「買賣超股數 × 當日收盤價」估出來的，所以這一步
      # 一定要排在 backfill.py 後面 —— 當日的 close/ 檔那時才寫好，否則就得自己再抓
      # 一次全市場行情。--days 14 的理由與 backfill 相同：排程可能被延遲甚至整次跳過，
      # 而這兩支來源都能指定日期，已存在的日期不會發出請求。
      # 官方資料，但仍是附加資訊，不該連帶讓當日行情更新失敗。
      - name: 抓三大法人買賣超
        continue-on-error: true
        run: python scripts/fetch_institutions.py --days 14 --sleep 3

      # 報價來自第三方的免費頁面（TrendForce、Yahoo），改版或臨時掛掉都有可能。
      # 那是附加資訊，不該連帶讓當日行情更新失敗，所以這兩步都允許出錯。
      - name: 抓上游報價與原物料
        continue-on-error: true
        run: python scripts/fetch_quotes.py

      # 集保一週只結算一次（每週五），但這一步每天跑也不會多出東西：資料日還沒換
      # 的話解出來的內容與已存的那一份一字不差，就不會再寫一次。第三方網站，
      # 同樣不該連帶讓當日行情更新失敗。
      - name: 抓集保股權分散表
        continue-on-error: true
        run: python scripts/fetch_holders.py

      # 集保的 opendata 只留最新一週，下一週就被蓋掉 —— 排程被 GitHub 延遲或整次
      # 跳過的話，那一週就永久沒了。官網的個股查詢頁還留著近一年，可以逐檔補回來。
      # 這一步在正常情況下不發任何查詢請求：那幾週的快照已經涵蓋前 200 名就直接略過，
      # 只有真的缺了才會補，一週的成本是 200 次小請求。
      - name: 補回漏掉的集保週資料
        continue-on-error: true
        run: python scripts/backfill_holders.py --source stock --weeks 3 --top 200

      # 美股日線。177 檔是全流程裡請求數最多的一步（其他第三方來源都是個位數到
      # 二十幾），實測一趟 148 秒、0.7 秒一檔。Yahoo 本來就有人在打（上面的
      # fetch_quotes.py 每天抓 8 個原物料與指數），會不會因為量級而限流是另一回事，
      # 所以：
      #   · continue-on-error —— 同其他第三方來源，不該連帶讓當日行情更新失敗
      #   · fetch_us.py 連續失敗 12 檔就自己放棄，剩下的沿用舊資料（被限流時每一檔
      #     都走完重試的話，177 檔要磨五十分鐘才知道整批都失敗）
      #   · timeout-minutes 是最後一道：即使上面兩層都沒攔住，也不會拖垮整個流程
      # 真的被限流的話，先調大 --sleep（預設 0.7）。
      - name: 抓美股日線
        continue-on-error: true
        timeout-minutes: 8
        run: python scripts/fetch_us.py

      # 日股 99 檔與韓股 109 檔，與上面那 177 檔**打同一個 Yahoo 端點**，排在它後面跑。
      # 被限流的話三支會一起中槍，而 fetch_pair.py 的 --give-up 會自己停下來。
      # 台股那一邊不抓：kline/ 已經有全市場的四價，理由寫在 scripts/pair.py。
      #
      # 韓股排最後，所以它是累積請求數最多的時候才開始跑，也最容易中槍。三個市場
      # 各自一份 market.json、各自一個 --give-up，前面那支失敗不會波及後面那支的舊資料。
      - name: 抓日股日線
        continue-on-error: true
        timeout-minutes: 6
        run: python scripts/fetch_pair.py jp

      - name: 抓韓股日線
        continue-on-error: true
        timeout-minutes: 7
        run: python scripts/fetch_pair.py kr

      # 網站只留最近兩年的每日原始檔（Pages 上限 1 GB，每日資料一年約長 130 MB）。
      # 要排在所有 build 前面：衍生檔照現存的原始檔重建，過期的由各支 build 自己清掉。
      - name: 修剪兩年以前的每日原始檔
        run: python scripts/prune_data.py

      - name: 重建索引與歷史序列
        run: python scripts/build_history.py

      # 要放在 build_history.py 後面：電子股的 K 線是由那一步一起寫出來的，
      # 結構分頁點進個股時要讀。結構本身只吃 close/，與排行無關。
      - name: 重建電子股價格結構
        continue-on-error: true
        run: python scripts/build_structure.py

      - name: 統計新進榜之後的表現
        run: python scripts/build_entry.py

      - name: 重建報價序列
        continue-on-error: true
        run: python scripts/build_quotes.py

      # 要放在 build_history.py 後面：個股序列只出給進過排行的代號，
      # 那份名單是從 history/ 讀的。
      - name: 重建集保序列
        continue-on-error: true
        run: python scripts/build_holders.py

      - name: 重建法人目錄與外資連續買賣超
        continue-on-error: true
        run: python scripts/build_institutions.py

      # 要放在 build_institutions.py 後面：短線訊號的「外資連買」讀的是它剛寫出來的
      # insti/streak/。放在前面也不會報錯，只是那一欄會是昨天的、或整欄空的。
      - name: 重建紀律頁的出場線
        continue-on-error: true
        run: python scripts/build_rule.py

      # 要放在 build_history.py 後面：相關性的台股那一邊吃 index.json 的交易日軸與
      # kline/，兩者都是那一步寫的。排在它前面的話，算出來的 twAsof 會停在上一次
      # 跑 build_history 的日期 —— 而畫面看起來一切正常，只有那行小字會透露。
      - name: 重算美股連動
        continue-on-error: true
        run: python scripts/build_us.py

      # 與上面同一個理由要放在 build_history.py 後面：台股那一邊吃 index.json 的
      # 交易日軸與 kline/。而且 build_pair.py 會把外股**裁到台股的最後一個交易日**，
      # 排錯位置的話那個「最後一天」是舊的，兩邊的漲跌幅就量到不同的區間 ——
      # 畫面上兩個數字並排看起來完全正常。
      #
      # 兩個市場分兩步而不是一支跑兩次：其中一邊的對照表寫壞時，另一邊還是會更新。
      - name: 重算日股族群對照
        continue-on-error: true
        run: python scripts/build_pair.py jp

      - name: 重算韓股族群對照
        continue-on-error: true
        run: python scripts/build_pair.py kr

      # 四市題材。吃的是 us／jp／kr 三份 market.json 加台股的 kline/，所以要排在
      # 上面那三支 fetch 與 build_history.py 全部跑完之後。前面任何一個市場沒抓到，
      # 這一步仍然算得出來（那一欄會用比較舊的最後一場，頁面上標得出來），
      # 所以不必跟著失敗。
      - name: 重算四市題材
        continue-on-error: true
        run: python scripts/build_cross.py

      # 價值頁。吃 close/、taiex.json、value/（上面 fetch_value 寫的）與報價頁的
      # quotes/index.json，所以排在 build_quotes.py 之後。
      - name: 重算價值頁
        continue-on-error: true
        run: python scripts/build_value.py

      # 價值頁的回測：同一套規則放回過去每個月底。只讀 value/pe/ 與 value/rev/，
      # 月底的資料一個月才變一次，每天跑是因為它只要兩秒，不必另外排一個月排程。
      - name: 重算價值頁回測
        continue-on-error: true
        run: python scripts/build_value_backtest.py

      - name: 提交資料變更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "資料無變化（可能是非交易日），不提交。"
          else
            git commit -m "資料更新 $(TZ=Asia/Taipei date +%Y-%m-%d)"

            # 從 checkout 到這裡要跑將近一小時，這段期間 main 很可能被人推了新
            # commit（前端的改動就常常落在下午）。那樣直接 push 會被 GitHub 擋下來，
            # 整天的資料就跟著 runner 一起消失。
            #
            # 不能改用 --force：這次 run 的工作樹是一小時前的，強推等於把期間的
            # 改動整批回退，而且下面的 upload-pages-artifact 會照著舊的 docs/ 發佈，
            # 線上網站看起來一切正常，只是前端退回了舊版。
            #
            # 所以是拉回來 rebase 再推。bot 的這個 commit 只碰 docs/data，-X theirs
            # 在 rebase 裡指的是「正在被套用的那一邊」，也就是 bot 自己 —— 萬一同一份
            # 資料檔兩邊都動過，以這次現算出來的為準。
            for i in 1 2 3; do
              if git push origin HEAD:main; then
                pushed=1
                break
              fi
              echo "推不上去（第 $i 次）：遠端在這次流程跑的期間前進了，拉回來 rebase 再試。"
              git pull --rebase -X theirs origin main
            done
            if [ -z "$pushed" ]; then
              echo "連續三次都推不上去，放棄。"
              exit 1
            fi
          fi

      # 由本流程直接發佈網站。不倚賴「push 觸發 Pages 建置」——bot 的 push
      # 不會觸發後續事件，那條路可能讓網站停在舊資料。
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4

      # 沒設定 secret 時會自動略過，不會讓整個流程失敗。
      # 非交易日因為沒有當天的新資料，也不會重複推播。
      - name: 推播 Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/notify_telegram.py
