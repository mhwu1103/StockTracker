<header class="app-bar">
  <div class="app-bar__top">
    <h1>景氣循環</h1>
  </div>
  <p class="app-bar__meta" id="meta">載入中…</p>

<nav class="tabs"></nav>
<nav class="subtabs"></nav>

<main class="view">
  <div id="view">
    <p class="hint">載入中…</p>
  </div>
</main>

<footer class="foot">
  「循環」只用公開資訊觀測站的月營收判斷，股價有沒有跟著走還沒有回測；「月曆」是過去每年同一個月的股價表現，
  walk-forward 檢驗的結果寫在那一頁最上面。這一頁不是投資建議。
</footer>

<script src="nav.js?v=75" defer></script>
<script src="cycle.js?v=75" defer></script>
