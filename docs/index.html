<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>台股成交值排行</title>
<meta name="description" content="台股上市成交值前 200 大排行與歷史變動">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="成交值排行">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<!-- ?v= 是前端版號，改 app.js／style.css 時要跟 docs/sw.js 的 VERSION 一起加一。
     版號一換就是新網址，瀏覽器不可能再拿到舊的外殼去配新的 data/index.json。 -->
<link rel="stylesheet" href="style.css?v=36">
</head>
<body>

<header class="app-bar">
  <div class="app-bar__top">
    <h1>台股成交值排行</h1>
    <!-- 美股連動是獨立的一頁、不是分頁，所以不進 tab 列；但只放在頁尾等於沒人找得到
         （排行頁的頁尾在兩百列之後），放在這裡是唯一不用捲動就看得到的位置。 -->
    <a class="linky" href="us.html" title="美股 × 台股連動">美股</a>
    <select id="scope-select" aria-label="排行範圍"></select>
    <div class="date-nav">
      <button type="button" id="date-prev" class="date-nav__btn" aria-label="前一個交易日" title="前一個交易日">‹</button>
      <select id="date-select" aria-label="交易日期"></select>
      <button type="button" id="date-next" class="date-nav__btn" aria-label="後一個交易日" title="後一個交易日">›</button>
    </div>
  </div>
  <p class="app-bar__meta" id="meta">載入中…</p>
  <p class="app-bar__stale" id="stale" hidden></p>
</header>

<!-- 導覽分兩層：這一列是六個群組（sticky），底下的 #subtabs 是該群組的分頁。
     群組的 href 由 app.js 依「上次看的是哪一頁」改寫，所以中鍵開新分頁也是對的。
     分頁清單只寫在 app.js 的 NAV 一處，這裡不列，免得兩邊對不起來。 -->
<nav class="tabs" id="tabs">
  <a href="#/rank" data-group="rank">排行</a>
  <a href="#/burst" data-group="tech">技術</a>
  <a href="#/holders" data-group="chips">籌碼</a>
  <a href="#/sector" data-group="money">資金</a>
  <a href="#/quote" data-group="world">環境</a>
  <a href="#/stock" data-group="find">查詢</a>
</nav>
<nav class="subtabs" id="subtabs"></nav>

<main id="view" class="view">
  <p class="hint">載入中…</p>
</main>

<footer class="foot">
  資料來源：臺灣證券交易所公開資訊（上市，含 ETF）。僅供參考，非投資建議。
  <a class="linky" href="us.html">美股 × 台股連動</a>
</footer>

<script src="app.js?v=36" defer></script>
</body>
</html>
