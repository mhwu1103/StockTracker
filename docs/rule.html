<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>操盤紀律</title>
<meta name="description" content="大盤溫控、持股出場線、短中線進場訊號與六大鐵律：照規則走，不照情緒走">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1216">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<!-- ?v= 是前端版號，各頁與 sw.js 要一致，見 index.html 的說明 -->
<link rel="stylesheet" href="style.css?v=67">
<!-- 亮／暗切換。這一支刻意不用 defer：要在 HTML 畫出來之前就把 data-theme 掛上去，
     否則深色使用者每次開頁都會先被白底閃一下。理由完整版在 theme.js 的開頭。 -->
<script src="theme.js?v=67"></script>
</head>
<!-- data-view 告訴 nav.js：這是獨立頁面，而且停在「紀律」那一項 -->
<body data-view="rule">

<header class="app-bar">
  <div class="app-bar__top">
    <h1>操盤紀律</h1>
  </div>
  <p class="app-bar__meta" id="meta">載入中…</p>
</header>

<!-- 與排行榜同一套兩層導覽，由 nav.js 從同一份 NAV 畫出來。 -->
<nav class="tabs"></nav>
<nav class="subtabs"></nav>

<main id="view" class="view">
  <p class="hint">載入中…</p>
</main>

<footer class="foot">
  規則整理自《股市大贏家》系列的操作手冊：鐵血六律、動能趨勢投資法與系統化操盤守則。
  這一頁只照收盤價與均線機械式地套規則，不是投資建議；持股只存在這台裝置的瀏覽器裡。
</footer>

<script src="nav.js?v=67" defer></script>
<script src="rule.js?v=67" defer></script>
</body>
</html>
