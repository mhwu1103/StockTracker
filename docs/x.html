<script src="theme.js?v=74"></script>
</head>
<!-- data-view 告訴 nav.js：這是獨立頁面，而且停在「觀點」那一項 -->

  </div>

<!-- 與排行榜同一套兩層導覽，由 nav.js 從同一份 NAV 畫出來。 -->

<nav class="subtabs"></nav>

<main id="view" class="view">
  <p class="hint">載入中…</p>
</main>

<footer class="foot">

  不做翻譯也不做評價。他的看法是一個人的看法，不是事實查核過的資訊，更不是投資建議。
</footer>

<script src="nav.js?v=74" defer></script>
<script src="x.js?v=74" defer></script>
</body>
