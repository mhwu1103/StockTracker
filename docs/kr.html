<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>韓股 × 台股族群</title>
<meta name="description" content="同一個產品線上對得起來的韓股與台股，並排看漲跌幅">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1216">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<!-- ?v= 是前端版號，各頁與 sw.js 要一致，見 index.html 的說明 -->
<link rel="stylesheet" href="style.css?v=76">
<!-- 亮／暗切換。這一支刻意不用 defer：要在 HTML 畫出來之前就把 data-theme 掛上去，
     否則深色使用者每次開頁都會先被白底閃一下。理由完整版在 theme.js 的開頭。 -->
<script src="theme.js?v=76"></script>
</head>
<!-- data-view 有兩個用途：告訴 nav.js「這是獨立頁面，而且停在韓股那一項」，
     也告訴 pair.js 要讀 data/kr/ 與哪一份文案。不要再加第二個屬性。 -->
<body data-view="kr">

<header class="app-bar">
  <div class="app-bar__top">
    <h1>韓股 × 台股族群</h1>
  </div>
  <p class="app-bar__meta" id="meta">載入中…</p>
</header>

<!-- 與排行榜同一套兩層導覽，由 nav.js 從同一份 NAV 畫出來 -->
<nav class="tabs"></nav>
<nav class="subtabs"></nav>

<main id="view" class="view">
  <p class="hint">載入中…</p>
</main>

<footer class="foot">
  韓股報價來源：Yahoo Finance（KOSPI 加 .KS、KOSDAQ 加 .KQ）。首爾與台北同一天開盤，
  這一頁擺的是漲跌幅不是領先訊號；而且韓股多半是對手不是上游，「韓漲台不跟」不一定是台股落後。
  僅供參考，非投資建議。
</footer>

<script src="nav.js?v=76" defer></script>
<script src="pair.js?v=76" defer></script>
</body>
</html>
